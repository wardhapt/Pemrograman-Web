<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 5</title>
    <link rel="stylesheet" href="Tugas5.css">
</head>
<body>

    <main class="container">

        <header>
            <div class="logo">
    <svg viewBox="0 0 16 16"
         width="40"
         height="40"
         fill="white">

        .28-.87.51-1.07-1.78-.2-3.64-.89

        -.08-.2-.36-1.02.08-2.12 0 0 .67-.21

        2.2-.82.44 1.1.16 1.92.08 2.12

</div>
            <h1>GitHub Finder</h1>
            <p>Temukan informasi pengguna GitHub.</p>
        </header>

        <section class="search-box">
            <form id="form-cari">
                <input
                    type="text"
                    id="username"
                    placeholder="Cari username siapa ya..."
                    required
                >
                <button type="submit">Ayo cari!!</button>
            </form>
        </section>

        <p id="loading" hidden>Sebentar ya...</p>
        <p id="pesan" hidden></p>

        <section id="profil" hidden>

            <div class="profile-card">

                <img id="avatar" alt="Foto profil pengguna">

                <div class="profile-info">
                    <h2 id="nama"></h2>
                    <p id="login"></p>
                    <p id="bio"></p>
                </div>

                <div class="stats">

                    <div>
                        <strong id="repo">0</strong>
                        <span>Repositori</span>
                    </div>

                    <div>
                        <strong id="followers">0</strong>
                        <span>Followers</span>
                    </div>

                    <div>
                        <strong id="following">0</strong>
                        <span>Following</span>
                    </div>

                </div>

                <a id="link" target="_blank" rel="noopener">
                    Kunjungi Profil GitHub
                </a>

            </div>

        </section>

        <footer>
            <p>Powered by GitHub REST API</p>
        </footer>

    </main>

    <script src="Tugas5.js"></script>

</body>
</html>
